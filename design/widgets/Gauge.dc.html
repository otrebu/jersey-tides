<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
    a { color: #B97E3D; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 230px; height: 230px; display: flex; align-items: center; justify-content: center; background: {{t.backdrop}}">
  <div style="width: 170px; height: 170px; box-sizing: border-box; border-radius: 24px; background: {{t.sky}}; box-shadow: {{t.shadow}}; padding: 14px 16px 13px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: {{t.sea55}}">St Helier</div>
    <div style="flex-grow: 1; display: flex; flex-direction: row; gap: 12px; align-items: stretch">
      <div style="display: flex; flex-direction: row; gap: 5px; align-items: stretch">
        <div style="position: relative; width: 10px; border-radius: 5px; background: {{t.fill8}}; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 81%; background: {{t.sea}}; border-radius: 5px"></div>
        </div>
        <div style="display: flex; flex-direction: column; justify-content: space-between; padding: 1px 0">
          <div style="font-size: 9px; font-variant-numeric: tabular-nums; color: {{t.sea30}}">9.0</div>
          <div style="font-size: 9px; font-variant-numeric: tabular-nums; color: {{t.sea30}}">3.1</div>
        </div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 0px">
        <div style="font-size: 13px; font-weight: 300; color: {{t.sea55}}">NOW</div>
        <div style="display: flex; flex-direction: row; align-items: baseline; gap: 4px">
          <div style="font-size: 34px; font-weight: 200; font-variant-numeric: tabular-nums; color: {{t.sea}}; line-height: 1.05">7.9</div>
          <div style="font-size: 13px; font-weight: 300; color: {{t.sea55}}">m</div>
          <svg width="10" height="10" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg" style="align-self: center">
            <polygon points="5,1.5 9.2,8.5 0.8,8.5" fill="{{t.sea}}"></polygon>
          </svg>
        </div>
        <div style="font-size: 11px; color: {{t.sea55}}; margin-top: 3px">81% of range</div>
      </div>
    </div>
    <div style="height: 0.5px; background: {{t.hair}}"></div>
    <div style="font-size: 12px; font-variant-numeric: tabular-nums; color: {{t.sea55}}">HW 23:24 &middot; 8.7</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":230,"height":230}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const rgb = dark ? '233,239,241' : '16,37,48';
    return { t: {
      sky: dark ? '#0B1417' : '#F4F6F6',
      backdrop: dark ? '#05090B' : '#E6EAEA',
      sea: dark ? '#E9EFF1' : '#102530',
      sea55: 'rgba(' + rgb + ',0.55)',
      sea30: 'rgba(' + rgb + ',0.30)',
      hair: 'rgba(' + rgb + ',0.14)',
      fill8: 'rgba(' + rgb + ',0.08)',
      dawn: dark ? '#E2AE6B' : '#B97E3D',
      shadow: dark ? '0 10px 28px rgba(0,0,0,0.5)' : '0 10px 28px rgba(16,37,48,0.10)'
    } };
  }
}
</script>
</body>
</html>
