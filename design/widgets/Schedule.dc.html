<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
    a { color: #B97E3D; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 424px; height: 230px; display: flex; align-items: center; justify-content: center; background: {{t.backdrop}}">
  <div style="width: 364px; height: 170px; box-sizing: border-box; border-radius: 24px; background: {{t.sky}}; box-shadow: {{t.shadow}}; padding: 14px 16px 13px 16px; display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: baseline">
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: {{t.sea55}}">St Helier &middot; Jersey</div>
      <div style="font-size: 12px; color: {{t.sea55}}">Wed 19 Aug</div>
    </div>
    <div style="flex-grow: 1; position: relative; display: flex; flex-direction: row; align-items: stretch; margin-top: 6px">
      <div style="position: absolute; left: 4px; right: 4px; top: 38px; height: 0.5px; background: {{t.hair}}"></div>
      <sc-for list="{{stations}}" as="s" hint-placeholder-count="4">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 1px">
          <div style="height: 12px; font-size: 9px; font-weight: 600; letter-spacing: 1.2px; color: {{t.sea30}}">{{s.day}}</div>
          <div style="height: 22px; display: flex; align-items: center">
            <sc-if value="{{s.up}}" hint-placeholder-val="{{ true }}">
              <svg width="11" height="11" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><polygon points="5,1.5 9.2,8.5 0.8,8.5" fill="{{s.markColor}}"></polygon></svg>
            </sc-if>
            <sc-if value="{{s.down}}" hint-placeholder-val="{{ false }}">
              <svg width="11" height="11" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><polygon points="5,8.5 9.2,1.5 0.8,1.5" fill="{{s.markColor}}"></polygon></svg>
            </sc-if>
          </div>
          <div style="font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; color: {{s.timeColor}}; margin-top: 5px">{{s.time}}</div>
          <div style="font-size: 12px; font-variant-numeric: tabular-nums; color: {{t.sea55}}">{{s.height}}</div>
          <div style="height: 13px; font-size: 11px; font-variant-numeric: tabular-nums; color: {{t.sea55}}">{{s.note}}</div>
        </div>
      </sc-for>
    </div>
    <div style="height: 0.5px; background: {{t.hair}}"></div>
    <div style="display: flex; flex-direction: row; align-items: center; gap: 4px; margin-top: 6px">
      <div style="font-size: 12px; font-variant-numeric: tabular-nums; color: {{t.sea55}}">now 7.9</div>
      <svg width="8" height="8" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><polygon points="5,1.5 9.2,8.5 0.8,8.5" fill="{{t.sea55}}"></polygon></svg>
      <div style="font-size: 12px; color: {{t.sea55}}">rising</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":424,"height":230}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const rgb = dark ? '233,239,241' : '16,37,48';
    const t = {
      sky: dark ? '#0B1417' : '#F4F6F6',
      backdrop: dark ? '#05090B' : '#E6EAEA',
      sea: dark ? '#E9EFF1' : '#102530',
      sea55: 'rgba(' + rgb + ',0.55)',
      sea30: 'rgba(' + rgb + ',0.30)',
      hair: 'rgba(' + rgb + ',0.14)',
      dawn: dark ? '#E2AE6B' : '#B97E3D',
      shadow: dark ? '0 10px 28px rgba(0,0,0,0.5)' : '0 10px 28px rgba(16,37,48,0.10)'
    };
    const raw = [
      { day: '', up: true, time: '23:24', height: '8.7 m', note: 'in 1 h 27', main: true },
      { day: 'THU', up: false, time: '05:58', height: '3.8 m', note: '' },
      { day: 'THU', up: true, time: '11:46', height: '8.3 m', note: '' },
      { day: 'THU', up: false, time: '18:21', height: '4.1 m', note: '' }
    ];
    const stations = raw.map(function (s) {
      return {
        day: s.day, time: s.time, height: s.height, note: s.note,
        up: s.up, down: !s.up,
        markColor: s.main ? t.sea : t.sea30,
        timeColor: s.main ? t.sea : t.sea55
      };
    });
    return { t, stations };
  }
}
</script>
</body>
</html>
