<!--
  Jersey Tides — TODAY screen · V2 PROPOSAL
  A redesign iteration for critique. Reuses the baseline's design language 1:1
  (design tokens, St Helier palette light+dark, SF typography, thin-space units,
  tabular numerals, curve-rendering approach, device chrome, floating theme toggle
  — see main-screen.html) and layers the brief's structure on top:
    · scrollable TODAY page with a big NOW-height hero + animated wave
    · scrub the graph (press/drag → time+height readout capsule)
    · swipe / chevrons page between the 7 days (crossfade + day/night veil)
    · full-bleed extremes table, sun day-band, moon phase row
  Fully self-contained: the whole week's tide data is embedded below and every
  pixel renders from it. Zero external resources; works from file:// or a static host.
-->

<style>

   the v2 additions derive from those same anchors (sea / dawn / sky / hairline).

  --sea-secondary:  rgba(16,37,48,0.55);     /* labels, dates, heights              */
  --sea-tertiary:   rgba(16,37,48,0.30);     /* now-line, past rows, de-emphasis     */
  --hairline:       rgba(16,37,48,0.14);     /* horizon line, table rules            */
  --dawn:           #B97E3D;                 /* sun ticks/times, day-band, moon glyph */

  /* --- v2 derivations (all anchored to the tokens above → theme-safe) --- */

  --band-night:     rgba(16,37,48,0.055);    /* sun band night portion               */
  --moon-lit:       rgba(185,126,61,0.85);   /* illuminated moon limb                */
  --moon-dark:      rgba(16,37,48,0.10);     /* moon shadow disc                     */

/* ============================================================================
   REVIEW CANVAS
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  background: var(--page-bg);
  color: var(--page-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 18px; padding: 40px 16px; min-height: 100vh;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.theme-toggle {
  position: fixed; top: 18px; right: 18px; z-index: 50;
  font: 600 12px var(--font-ui); letter-spacing: 0.02em; color: var(--page-fg);
  background: color-mix(in srgb, var(--page-bg) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--page-fg) 35%, transparent);
  border-radius: 999px; padding: 7px 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.theme-toggle:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
.theme-toggle svg { width: 14px; height: 14px; }
.caption { font: 400 12.5px var(--font-ui); color: var(--page-fg); letter-spacing: 0.01em; text-align: center; }

/* ============================================================================
   DEVICE CHROME  (identical to baseline)
   ========================================================================== */
.device {
  width: calc(var(--screen-w) + 24px); height: calc(var(--screen-h) + 24px);
  background: var(--bezel); border: 1px solid var(--bezel-edge);
  border-radius: var(--radius-device); padding: 12px;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.3);
}
.screen {
  position: relative; width: var(--screen-w); height: var(--screen-h);
  border-radius: var(--radius-screen); overflow: hidden; background: var(--sky);
}
.island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 125px; height: 37px; background: #000; border-radius: 20px; z-index: 20;
}
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 15;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px 0 34px; color: var(--sea); pointer-events: none;
}
.statusbar .clock { font: 600 15px var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; padding-top: 2px; }
.statusbar .indicators { display: flex; align-items: center; gap: 6px; }
.statusbar .indicators svg { display: block; fill: currentColor; }

/* day/night transition veil — above content, below status bar */
.veil {
  position: absolute; inset: 0; z-index: 12; pointer-events: none;
  background: var(--veil); opacity: 0;
}

/* Scroll viewport = the page ScrollView. */
.viewport { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.viewport::-webkit-scrollbar { width: 0; height: 0; }

/* ============================================================================
   APP CONTENT
   ========================================================================== */
.app {
  padding: var(--margin); padding-top: calc(var(--safe-top) + var(--margin));
  padding-bottom: 40px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
  color: var(--sea); will-change: transform, opacity;
}

/* --- Header --- */
.header { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.h-row { display: flex; align-items: center; gap: 12px; min-height: 20px; }
.station { font: 600 var(--fs-engraving)/1 var(--font-ui); text-transform: uppercase; letter-spacing: var(--track); color: var(--sea-secondary); }
.spacer { flex: 1; }
.iconbtn { color: var(--sea-secondary); display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; }
.iconbtn svg { width: 17px; height: 17px; }
.todaychip {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  font: 600 var(--fs-engraving) var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--sea-secondary); background: var(--chip-bg);
  border: 0.5px solid var(--chip-line); border-radius: 999px; padding: 5px 11px 5px 8px;
}
.todaychip svg { width: 11px; height: 11px; }
.eyebrow { font: 600 var(--fs-engraving)/1 var(--font-ui); text-transform: uppercase; letter-spacing: var(--track); color: var(--sea-secondary); }
.eyebrow.accent { color: var(--dawn); }
.daytitle { font: 300 var(--fs-daytitle)/1.05 var(--font-ui); color: var(--sea); letter-spacing: -0.01em; }
.daysub { font: 400 var(--fs-meta)/1.2 var(--font-ui); color: var(--sea-secondary); font-variant-numeric: tabular-nums; }

/* --- Day dots (7-day mini navigator) --- */
.dots { display: flex; align-items: center; gap: 9px; width: 100%; padding: 2px 0 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sea-tertiary); border: 0; padding: 0; cursor: pointer; transition: all .18s ease; }
.dot.today { box-shadow: 0 0 0 1.5px var(--sky), 0 0 0 3px var(--sea-tertiary); }
.dot.current { width: 22px; border-radius: 4px; background: var(--sea); }
.dot.current.today { box-shadow: none; background: var(--dawn); }

/* --- Hero (today only) — full-bleed wave band behind the NOW height --- */
.hero { position: relative; width: calc(100% + 48px); margin: 0 -24px; padding: 6px 24px 4px; overflow: hidden; }
.hero-wave { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.hero-num { display: flex; align-items: baseline; gap: 4px; }
.hero-num .n { font: 100 var(--fs-hero)/0.98 var(--font-ui); color: var(--sea); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: -0.02em; }
.hero-num .u { font: 200 var(--fs-hero-unit)/1 var(--font-ui); color: var(--sea-secondary); }
.trend { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; align-self: center; transform: translateY(4px);
  font: 600 var(--fs-engraving) var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--sea-secondary);
  background: var(--chip-bg); border: 0.5px solid var(--chip-line); border-radius: 999px; padding: 4px 9px; }
.trend svg { width: 9px; height: 9px; fill: var(--dawn); }
.hero-next { margin-top: 8px; font: 400 var(--fs-table)/1.25 var(--font-ui); color: var(--sea-secondary); font-variant-numeric: tabular-nums; }
.hero-next b { color: var(--sea); font-weight: 500; }
.hero-next .dot-sep { color: var(--sea-tertiary); padding: 0 3px; }

/* --- Graph (full-bleed) --- */
.graphwrap { position: relative; width: calc(100% + 48px); margin: 0 -24px; touch-action: pan-y; }
.graphwrap svg.curve { display: block; width: 100%; height: auto; }
.chev {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
  width: 34px; height: 46px; display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--sea-tertiary);
  opacity: 0; transition: color .15s ease, opacity .18s ease;      /* revealed on hover — a quiet mouse affordance */
}
.graphwrap:hover .chev { opacity: 1; }
.chev:hover { color: var(--sea-secondary); }
.chev:focus-visible { opacity: 1; outline: 2px solid var(--dawn); outline-offset: -4px; border-radius: 8px; }
.chev.active { color: var(--dawn); opacity: 1; }
.chev[disabled] { opacity: 0 !important; pointer-events: none; }
.chev.l { left: 0; } .chev.r { right: 0; }
.chev svg { width: 15px; height: 26px; }
.scrub-hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; z-index: 2; pointer-events: none;
  font: 600 var(--fs-engraving) var(--font-ui); letter-spacing: 0.05em; text-transform: uppercase; color: var(--sea-tertiary); transition: opacity .2s ease; }

/* --- Extremes table (full-bleed, edge to edge) --- */
.section-label { font: 600 var(--fs-engraving) var(--font-ui); letter-spacing: var(--track); text-transform: uppercase; color: var(--sea-secondary); padding: 0 0 2px; }
.extremes { width: calc(100% + 48px); margin: 0 -24px; }
.exrow { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: baseline; column-gap: 14px;

.c-horizon     { stroke: var(--hairline); }
.c-knockout    { fill: var(--sky); }
.c-tick        { stroke: var(--dawn); }

.svg-horizon   { font: 400 var(--fs-meta) var(--font-ui);  fill: var(--sea-secondary); }
.svg-sun       { font: 400 var(--fs-meta) var(--font-ui);  fill: var(--dawn); }
.svg-ctime     { font: 600 var(--fs-chart) var(--font-mono); fill: var(--sea); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------------------------------- helpers ---------------------------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const THIN  = " ";                                   // Formatters.swift thinSpace
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const minsOf = s => { const [h,m] = s.split(":").map(Number); return h*60 + m; };
const hVal  = m => (Math.round(m*10)/10).toFixed(1);      // heightValue: "%.1f", no unit
const hStr  = m => hVal(m) + THIN + "m";                  // height: value + thin space + m
function fmtTime(m){ m = Math.round(clamp(m,0,1440)); const h=Math.floor(m/60), mm=m%60; return `${String(h).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; }
function countdown(target, now){ const d = target - now; if (d <= 0) return "now"; const h=Math.floor(d/60), r=d%60; return h>0 ? `in ${h} h ${String(r).padStart(2,"0")} m` : `in ${r} m`; }
function dayLength(mins){ return `${Math.floor(mins/60)} h ${String(mins%60).padStart(2,"0")}`; }
function el(tag, cls, txt){ const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function svg(tag, attrs){ const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
function isoDate(iso){ return new Date(iso + "T12:00:00Z"); }
function fmtLong(iso){ return new Intl.DateTimeFormat("en-GB", { weekday:"long", day:"numeric", month:"long", timeZone:"UTC" }).format(isoDate(iso)); }
function fmtDayMonth(iso){ return new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"long", timeZone:"UTC" }).format(isoDate(iso)); }

/* height sampled from a day's 10-min curve, linearly interpolated (for scrubbing). */
function heightAt(curve, mins){
  const f = clamp(mins,0,1440) / 10;
  const i = Math.floor(f);
  if (i >= curve.length - 1) return curve[curve.length - 1].h;
  const a = curve[i].h, b = curve[i+1].h;
  return a + (b - a) * (f - i);
}

/* ------------------------------- global state -------------------------------- */
const days = DATA.days;
const todayIndex = Math.max(0, days.findIndex(d => d.date === DATA.today));
const nowMin = minsOf(DATA.nowTime);
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = { idx: todayIndex, anim: false };

const appEl = document.getElementById("app");
const viewport = document.getElementById("viewport");
const veil = document.getElementById("veil");
document.getElementById("clock").textContent = DATA.nowTime;

/* --------------------------------- icons ------------------------------------- */
function iconWaves(){
  const s = svg("svg", { viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", "stroke-width":1.6, "stroke-linecap":"round", "stroke-linejoin":"round" });
  s.innerHTML = '<path d="M2 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><line x1="4.5" y1="20.5" x2="19.5" y2="3.5" stroke-width="1.8"/>';
  return s;
}
function iconGear(){
  const s = svg("svg", { viewBox:"0 0 24 24" });
  let teeth = "";
  for (let k=0;k<8;k++) teeth += `<rect x="10.6" y="1.4" width="2.8" height="4.2" rx="0.9" transform="rotate(${k*45} 12 12)"/>`;
  s.innerHTML = `<g fill="currentColor">${teeth}<circle cx="12" cy="12" r="6"/></g><circle cx="12" cy="12" r="2.5" fill="var(--sky)"/>`;
  return s;
}
function chevSvg(dir){
  const s = svg("svg", { viewBox:"0 0 15 26", fill:"none", stroke:"currentColor", "stroke-width":1.8, "stroke-linecap":"round", "stroke-linejoin":"round" });
  s.innerHTML = dir === "l" ? '<path d="M11 3 L4 13 L11 23"/>' : '<path d="M4 3 L11 13 L4 23"/>';
  return s;
}

/* --------------------------------- header ------------------------------------ */
function relativeLabel(delta){
  if (delta === 0) return "Today";
  if (delta === 1) return "Tomorrow";
  if (delta === -1) return "Yesterday";
  return delta > 0 ? `In ${delta} days` : `${-delta} days ago`;
}
function headerEl(day, isToday, idx){
  const wrap = el("div", "header");
  const row  = el("div", "h-row");
  row.append(el("span", "station", `${DATA.station} · Jersey`));
  row.append(el("span", "spacer"));
  if (isToday){
    const w = el("button", "iconbtn"); w.type = "button"; w.title = "Start Tide Watch"; w.setAttribute("aria-label","Start Tide Watch"); w.append(iconWaves());
    const g = el("button", "iconbtn"); g.type = "button"; g.title = "Settings"; g.setAttribute("aria-label","Settings"); g.append(iconGear());
    row.append(w, g);
  } else {
    const chip = el("button", "todaychip"); chip.type = "button"; chip.setAttribute("aria-label","Back to today");
    chip.append(chevSvg("l"), document.createTextNode("Today"));
    chip.addEventListener("click", () => goTo(todayIndex));
    row.append(chip);
  }
  wrap.append(row);

  if (isToday){
    wrap.append(el("div", "eyebrow accent", "Today"));
    wrap.append(el("div", "daytitle", fmtLong(day.date)));
  } else {
    wrap.append(el("div", "eyebrow", relativeLabel(idx - todayIndex)));
    const t = el("div", "daytitle", day.weekday);
    wrap.append(t);
    wrap.append(el("div", "daysub", fmtDayMonth(day.date)));
  }
  return wrap;
}

/* --------------------------------- day dots ---------------------------------- */
function dotsEl(idx){
  const wrap = el("div", "dots");
  days.forEach((d, i) => {
    const b = el("button", "dot"); b.type = "button"; b.setAttribute("aria-label", `${d.weekday} ${fmtDayMonth(d.date)}`);
    if (i === todayIndex) b.classList.add("today");
    if (i === idx) b.classList.add("current");
    b.addEventListener("click", () => goTo(i));
    wrap.append(b);
  });
  return wrap;
}

/* ---------------------------------- hero ------------------------------------- */
function heroEl(day){
  const evMin  = day.events.map(e => minsOf(e.time));
  const nextIdx = evMin.findIndex(t => t >= nowMin);
  const nextEx  = nextIdx >= 0 ? day.events[nextIdx] : day.events[day.events.length - 1];
  const rising  = nextEx.type === "high";

  const hero = el("div", "hero");

  /* animated wave band behind the number */
  const wsvg = svg("svg", { class:"hero-wave", viewBox:"0 0 393 120", preserveAspectRatio:"none" });
  const mkWave = (baseY, amp, waves, dur, fill, cls) => {
    const W = 393, seg = W;                          // path spans 2 segments; loops by translating one seg
    let d = `M 0 ${baseY}`;
    const steps = 80;
    for (let i=0;i<=steps;i++){ const x = i/steps*(W*2); const y = baseY + Math.sin((x/seg)*waves*Math.PI + 0)*amp; d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`; }
    d += ` L ${W*2} 120 L 0 120 Z`;
    const g = svg("g", {});
    const p = svg("path", { d, fill });
    if (cls) p.setAttribute("class", cls);
    g.append(p);
    if (!reduceMotion){
      const anim = svg("animateTransform", { attributeName:"transform", type:"translate", from:"0 0", to:`-${W} 0`, dur:`${dur}s`, repeatCount:"indefinite" });
      g.append(anim);
    }
    return g;
  };
  wsvg.append(mkWave(90, 6, 4, 9.5, "var(--wave-fill)"));
  wsvg.append(mkWave(84, 8, 3, 13, "var(--wave-fill)"));
  const crest = mkWave(84, 8, 3, 13, "none"); crest.querySelector("path").setAttribute("stroke","var(--wave-crest)"); crest.querySelector("path").setAttribute("stroke-width","1.5"); crest.querySelector("path").setAttribute("fill","none");
  wsvg.append(crest);
  hero.append(wsvg);

  const inner = el("div", "hero-inner");
  inner.append(el("div", "eyebrow", "Now · water level"));

  const num = el("div", "hero-num");
  num.append(el("span", "n", hVal(DATA.nowHeight)));
  num.append(el("span", "u", "m"));
  const trend = el("span", "trend");
  const tri = svg("svg", { viewBox:"0 0 12 12" });
  tri.innerHTML = rising ? '<path d="M6 2 L10.5 9.5 L1.5 9.5 Z"/>' : '<path d="M6 10 L1.5 2.5 L10.5 2.5 Z"/>';
  trend.append(tri, document.createTextNode(rising ? "Rising" : "Falling"));
  num.append(trend);
  inner.append(num);

  const next = el("div", "hero-next");
  const label = nextEx.type === "high" ? "high water" : "low water";
  next.innerHTML =
    `Next <b>${label} ${hStr(nextEx.height)}</b>`
    + `<span class="dot-sep">·</span>${nextEx.time}`
    + `<span class="dot-sep">·</span>${countdown(minsOf(nextEx.time), nowMin)}`;
  inner.append(next);

  hero.append(inner);
  return hero;
}

/* ============================================================================
   TIDE CURVE  (baseline TideCurveView approach, per-day domain) + scrub overlay
   ============================================================================= */
const VBW = 393, VBH = 246, C_TOP = 40, C_BOT = 202, PLOTH = C_BOT - C_TOP;

function graphEl(day, isToday){
  const wrap = el("div", "graphwrap");
  const root = svg("svg", { class:"curve", viewBox:`0 0 ${VBW} ${VBH}`, xmlns:SVGNS });
  const curve = day.curve, events = day.events, N = curve.length;

  const xSample = i => (i / (N - 1)) * VBW;            // 00:00 → 24:00 across the width
  const xTime   = m => (m / 1440) * VBW;

  const hs = curve.map(p => p.h).concat(events.map(e => e.height));
  let lo = Math.min(...hs), hi = Math.max(...hs);
  const pad = Math.max(hi - lo, 1) * 0.07; lo -= pad; hi += pad;
  const span = hi - lo;
  const yOf = h => C_TOP + (1 - (h - lo) / span) * PLOTH;

  const defs = svg("defs");
  const grad = svg("linearGradient", { id:"seaFill", gradientUnits:"userSpaceOnUse", x1:0, y1:C_TOP, x2:0, y2:C_BOT });
  grad.append(svg("stop", { offset:"0", class:"c-fill-top" }), svg("stop", { offset:"1", class:"c-fill-bottom" }));
  defs.append(grad);
  root.append(defs);

  /* 1 — sea fill */
  let d = `M ${xSample(0).toFixed(2)} ${yOf(curve[0].h).toFixed(2)}`;
  for (let i=1;i<N;i++) d += ` L ${xSample(i).toFixed(2)} ${yOf(curve[i].h).toFixed(2)}`;
  root.append(svg("path", { d: d + ` L ${VBW} ${C_BOT} L 0 ${C_BOT} Z`, fill:"url(#seaFill)" }));

  /* 2 — horizon at mean level of the day's extremes */
  const evH = events.map(e => e.height);
  const datum = (Math.min(...evH) + Math.max(...evH)) / 2;
  const hy = yOf(datum);
  root.append(svg("line", { class:"c-horizon", x1:0, y1:hy, x2:VBW, y2:hy, "stroke-width":0.5 }));
  const knock = svg("rect", { class:"c-knockout" }); root.append(knock);
  const hLabel = svg("text", { class:"svg-horizon", "text-anchor":"end", x: VBW - 6, y: hy, "dominant-baseline":"middle" });
  hLabel.textContent = hVal(datum); root.append(hLabel);

  /* 4 — sun ticks */
  const sunTimes = [];
  [day.sunrise, day.sunset].forEach(s => {
    const x = clamp(xTime(minsOf(s)), 0, VBW);
    root.append(svg("line", { class:"c-tick", x1:x, y1:C_BOT-7, x2:x, y2:C_BOT, "stroke-width":1 }));
    const t = svg("text", { class:"svg-sun", "text-anchor":"middle", x:x, y: C_BOT + 15 });
    t.textContent = s; root.append(t); sunTimes.push({ node:t, tickX:x });
  });

  /* 5 — in-plot extreme labels */
  const lwSpans = [];
  events.forEach(ev => {
    const mx = xTime(minsOf(ev.time)), my = yOf(ev.height);
    const r = ev.type === "high" ? 3 : 3.5, blockH = 24;
    let top = ev.type === "high" ? my - r - 3 - blockH : my + r + 3;
    top = clamp(top, 0, VBH - blockH);
    const tN = svg("text", { class:"svg-ctime",   "text-anchor":"middle", x:mx, y: top + 9,  "data-mx":mx });
    tN.textContent = ev.time;
    const hN = svg("text", { class:"svg-cheight", "text-anchor":"middle", x:mx, y: top + 21, "data-mx":mx });
    hN.textContent = hStr(ev.height);
    root.append(tN, hN);
    if (ev.type === "low") lwSpans.push({ node:tN, alt:hN, mx });
  });

  /* 6 — now-line + now-dot (today only) */
  const overlay = svg("g", {});
  if (isToday){
    const nowX = clamp(xTime(nowMin), 1, VBW - 1);
    root.append(svg("line", { class:"c-nowline", x1:nowX, y1:C_TOP, x2:nowX, y2:C_BOT, "stroke-width":0.75 }));
    const nowY = yOf(DATA.nowHeight);
    const mask = svg("mask", { id:"nowPunch" });
    mask.append(svg("rect", { x:0, y:0, width:VBW, height:VBH, fill:"#fff" }), svg("circle", { cx:nowX, cy:nowY, r:5.5, fill:"#000" }));
    defs.append(mask);
    overlay.setAttribute("mask", "url(#nowPunch)");
    root.append(svg("circle", { class:"c-nowdot", cx:nowX, cy:nowY, r:3.5 }));
  }

  /* 3 — curve stroke + markers (inside overlay so the now-dot punches through) */
  overlay.append(svg("path", { class:"c-stroke", d:d, "stroke-width":1.5, "stroke-linecap":"round", "stroke-linejoin":"round" }));
  events.forEach(ev => {
    const cx = xTime(minsOf(ev.time)), cy = yOf(ev.height);
    if (ev.type === "high") overlay.append(svg("circle", { class:"c-hw", cx, cy, r:3 }));
    else overlay.append(svg("circle", { class:"c-lw", cx, cy, r:3.5, "stroke-width":1.5 }));
  });
  root.insertBefore(overlay, null);
  /* keep now-dot on top of overlay */
  if (isToday){ const nd = root.querySelector(".c-nowdot"); root.append(nd); }

  /* --- scrub overlay group (hidden until pointer) --- */
  const scrub = svg("g", { class:"scrub-g" }); scrub.style.opacity = "0"; scrub.style.transition = "opacity .12s ease";
  const sLine = svg("line", { class:"scrub-line", x1:0, y1:C_TOP, x2:0, y2:C_BOT });
  const sDot  = svg("circle", { class:"scrub-dot", cx:0, cy:0, r:4 });
  const sCap  = svg("rect", { class:"scrub-cap", x:0, y:6, rx:6, ry:6, height:20 });
  const sTxt  = svg("text", { class:"scrub-cap-t", "text-anchor":"middle", y:20 });
  scrub.append(sLine, sCap, sTxt, sDot);
  root.append(scrub);

  /* chevrons + hint */
  const cl = el("button", "chev l"); cl.type = "button"; cl.setAttribute("aria-label","Previous day"); cl.append(chevSvg("l"));
  const cr = el("button", "chev r"); cr.type = "button"; cr.setAttribute("aria-label","Next day"); cr.append(chevSvg("r"));
  if (state.idx <= 0) cl.disabled = true;
  if (state.idx >= days.length - 1) cr.disabled = true;
  cl.addEventListener("click", () => goTo(state.idx - 1));
  cr.addEventListener("click", () => goTo(state.idx + 1));

  const hint = el("div", "scrub-hint", "Drag to read · swipe to change day");

  wrap.append(root, cl, cr, hint);

  /* labels second pass (measure + clamp), mirrors baseline */
  const clampX = (desired, w) => clamp(desired, 0, Math.max(VBW - w, 0));
  requestAnimationFrame(() => {
    root.querySelectorAll("[data-mx]").forEach(node => {
      const mx = parseFloat(node.getAttribute("data-mx"));
      const w = node.getComputedTextLength();
      node.setAttribute("x", clampX(mx - w/2, w) + w/2);
    });
    const spans = lwSpans.map(s => { const w = Math.max(s.node.getComputedTextLength(), s.alt.getComputedTextLength()); const x = clampX(s.mx - w/2, w); return { lo:x, hi:x+w, mx:s.mx }; });
    sunTimes.forEach(s => {
      const w = s.node.getComputedTextLength();
      let cx = clampX(s.tickX - w/2, w) + w/2;
      spans.forEach(ex => { if (cx - w/2 < ex.hi && cx + w/2 > ex.lo){ cx = s.tickX >= ex.mx ? ex.hi + 3 + w/2 : ex.lo - 3 - w/2; cx = clampX(cx - w/2, w) + w/2; } });
      s.node.setAttribute("x", cx);
    });
    const b = hLabel.getBBox();
    knock.setAttribute("x", b.x - 2); knock.setAttribute("y", b.y - 2);
    knock.setAttribute("width", b.width + 4); knock.setAttribute("height", b.height + 4);
  });

  return { wrap, root, curve, xTime, yOf, scrub, sLine, sDot, sCap, sTxt, hint, cl, cr };
}

/* ------------------------------ extremes table ------------------------------- */
function tableEl(day, isToday){
  const block = el("div", "");
  block.style.width = "100%";
  block.append(el("div", "section-label", "Tides"));
  const table = el("div", "extremes");
  const evMin = day.events.map(e => minsOf(e.time));
  const nextIdx = isToday ? evMin.findIndex(t => t >= nowMin) : -1;

  day.events.forEach((ev, i) => {
    const row = el("div", "exrow");
    const t = evMin[i];
    /* baseline ExtremesTable.rowColor: past→tertiary, next→sea, later→secondary. */
    let color;
    if (isToday){
      color = t < nowMin ? "var(--sea-tertiary)" : (i === nextIdx ? "var(--sea)" : "var(--sea-secondary)");
      if (i === nextIdx) row.classList.add("next");
    } else {
      color = "var(--sea)";
    }
    row.style.color = color;

    const tag = el("div", "tag", ev.type === "high" ? "HW" : "LW");
    const time = el("div", "time", ev.time);
    const h = el("div", "h", hStr(ev.height));
    const swing = el("div", "swing");
    if (i > 0){ const dd = ev.height - day.events[i-1].height; swing.textContent = `${dd >= 0 ? "↑" : "↓"} ${hVal(Math.abs(dd))}`; swing.style.color = isToday && t < nowMin ? "var(--sea-tertiary)" : "var(--sea-secondary)"; }
    row.append(tag, time, h, swing);
    table.append(row);
  });
  block.append(table);
  return block;
}

/* --------------------------------- sun block --------------------------------- */
function sunEl(day, isToday){
  const block = el("div", "sunblock");
  block.append(el("div", "section-label", "Sun"));

  const SW = 393, SH = 34, x = m => (m/1440)*SW;
  const s = svg("svg", { class:"sunband-svg", viewBox:`0 0 ${SW} ${SH}`, preserveAspectRatio:"none" });
  const sr = minsOf(day.sunrise), ss = minsOf(day.sunset);
  const defs = svg("defs");
  const g = svg("linearGradient", { id:`dayg${day.date}`, x1:"0", y1:"0", x2:"1", y2:"0" });
  g.append(
    svg("stop", { offset:"0",   "stop-color":"var(--band-day-a)" }),
    svg("stop", { offset:"0.5", "stop-color":"var(--band-day-b)" }),
    svg("stop", { offset:"1",   "stop-color":"var(--band-day-a)" })
  );
  defs.append(g); s.append(defs);
  /* night base */
  s.append(svg("rect", { x:0, y:10, width:SW, height:14, rx:3, fill:"var(--band-night)" }));
  /* daylight span */
  s.append(svg("rect", { x:x(sr), y:10, width:Math.max(0, x(ss)-x(sr)), height:14, rx:3, fill:`url(#dayg${day.date})` }));
  /* gentle daylight arc peaking at solar noon */
  const noon = (sr+ss)/2;
  s.append(svg("path", { d:`M ${x(sr)} 17 Q ${x(noon)} 3 ${x(ss)} 17`, fill:"none", stroke:"var(--dawn)", "stroke-width":1, "stroke-opacity":0.55 }));
  /* endpoints */
  [sr, ss].forEach(m => s.append(svg("circle", { cx:x(m), cy:17, r:2.4, fill:"var(--dawn)" })));
  /* sun position marker for today (daytime only) */
  if (isToday && nowMin > sr && nowMin < ss){
    const frac = (nowMin - sr) / (ss - sr);
    const sy = 17 - Math.sin(frac*Math.PI)*13;
    s.append(svg("circle", { cx:x(nowMin), cy:sy, r:4, fill:"var(--dawn)" }));
    s.append(svg("circle", { cx:x(nowMin), cy:sy, r:6.5, fill:"none", stroke:"var(--dawn)", "stroke-width":1, "stroke-opacity":0.5 }));
  }
  const band = el("div", "sunband"); band.append(s);
  block.append(band);

  const row = el("div", "sunrow");
  const sunGlyph = svg("svg", { viewBox:"0 0 16 16", width:13, height:13, style:"vertical-align:-1px" });
  sunGlyph.innerHTML = '<circle cx="8" cy="8" r="3.2" fill="var(--dawn)"/><g stroke="var(--dawn)" stroke-width="1.1" stroke-linecap="round"><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3" y1="3" x2="4.4" y2="4.4"/><line x1="11.6" y1="11.6" x2="13" y2="13"/><line x1="3" y1="13" x2="4.4" y2="11.6"/><line x1="11.6" y1="4.4" x2="13" y2="3"/></g>';
  const rise = el("span"); rise.append(sunGlyph.cloneNode(true), document.createTextNode(" ")); rise.append(Object.assign(el("span","v",day.sunrise)));
  row.append(rise);
  row.append(el("span", "arrow", "→"));
  row.append(el("span", "v", day.sunset));
  row.append(el("span", "len", `${dayLength(day.dayLengthMin)} of daylight`));
  block.append(row);
  return block;
}

/* --------------------------------- moon row ---------------------------------- */
function moonSvg(size, k, waxing){
  const r = size/2, cx = r, cy = r;
  const s = svg("svg", { class:"glyph", viewBox:`0 0 ${size} ${size}`, width:size, height:size });
  s.append(svg("circle", { cx, cy, r:r-0.5, fill:"var(--moon-dark)", stroke:"var(--hairline)", "stroke-width":0.75 }));
  const termRx = r * Math.abs(2*k - 1);
  const gib = k > 0.5;
  let d;
  if (waxing){ const term = gib ? 1 : 0; d = `M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} A ${termRx} ${r} 0 0 ${term} ${cx} ${cy-r} Z`; }
  else       { const term = gib ? 0 : 1; d = `M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} A ${termRx} ${r} 0 0 ${term} ${cx} ${cy-r} Z`; }
  s.append(svg("path", { d, fill:"var(--moon-lit)" }));
  return s;
}
function moonEl(day){
  const mp = day.moonPhase;
  if (!mp) return el("div", "");                       // gracefully omit if absent
  const waxing = mp.fraction < 0.5;                    // new→full is waxing (fraction 0→0.5)
  const row = el("div", "moonrow");
  row.append(moonSvg(20, mp.illumination, waxing));
  row.append(el("span", "m-label", "Moon"));
  row.append(el("span", "m-name", mp.name));
  row.append(el("span", "m-illum", `${Math.round(mp.illumination*100)}% lit`));
  return row;
}

/* ============================================================================
   RENDER + PAGER
   ============================================================================= */
function renderPage(idx){
  state.idx = idx;
  const day = days[idx], isToday = day.date === DATA.today;
  appEl.innerHTML = "";
  appEl.append(headerEl(day, isToday, idx));
  appEl.append(dotsEl(idx));
  if (isToday) appEl.append(heroEl(day));
  const g = graphEl(day, isToday);
  appEl.append(g.wrap);
  appEl.append(tableEl(day, isToday));
  appEl.append(sunEl(day, isToday));
  appEl.append(moonEl(day));
  viewport.scrollTop = 0;
  wireGraph(g, day, isToday);
}

/* --- scrub + swipe gestures on the graph --------------------------------------
   Positional scrub: press anywhere on the graph and the readout appears AT that
   x (no long drag needed — tap the far edge, read the far edge). A decisive
   horizontal throw past the commit threshold (or a flick) turns the page; short
   / medium drags stay scrubs. Vertical drags fall through to page scroll
   (touch-action: pan-y). Chevrons + dots are the deterministic mouse affordance. */
const SWIPE_ENGAGE = 74, SWIPE_COMMIT = 118, FLICK = 0.55;

function wireGraph(g, day, isToday){
  const root = g.root;
  let gs = null;

  function xToMins(clientX){
    const rect = root.getBoundingClientRect();
    const vbX = (clientX - rect.left) / rect.width * VBW;
    return clamp(vbX / VBW * 1440, 0, 1440);
  }
  function showScrub(clientX){
    const mins = xToMins(clientX);
    const h = heightAt(day.curve, mins);
    const x = g.xTime(mins), y = g.yOf(h);
    g.sLine.setAttribute("x1", x); g.sLine.setAttribute("x2", x);
    g.sDot.setAttribute("cx", x); g.sDot.setAttribute("cy", y);
    const label = `${fmtTime(mins)}  ${hStr(h)}`;
    g.sTxt.textContent = label;
    const w = label.length * 6.7 + 16;
    const cx = clamp(x, w/2, VBW - w/2);
    g.sCap.setAttribute("x", cx - w/2); g.sCap.setAttribute("width", w);
    g.sTxt.setAttribute("x", cx);
    g.scrub.style.opacity = "1";
    g.hint.style.opacity = "0";
  }
  function hideScrub(){ g.scrub.style.opacity = "0"; g.hint.style.opacity = ""; }

  function preview(dx){
    const dir = dx < 0 ? 1 : -1;                        // drag left → next day
    const target = state.idx + dir;
    const canGo = target >= 0 && target < days.length;
    const over = Math.max(0, Math.abs(dx) - SWIPE_ENGAGE);
    const eff = canGo ? over * 0.55 : over * 0.18;      // rubberband at the ends
    appEl.style.transition = "none";
    appEl.style.transform = `translateX(${Math.sign(dx) * eff}px)`;
    const prog = canGo ? clamp(over / (SWIPE_COMMIT - SWIPE_ENGAGE), 0, 1) : 0;
    veil.style.transition = "none"; veil.style.opacity = String(prog * 0.26);
    g.cl.classList.toggle("active", dir === -1 && canGo && prog > 0.15);
    g.cr.classList.toggle("active", dir === 1 && canGo && prog > 0.15);
  }
  function springBack(){
    appEl.style.transition = "transform .22s ease"; appEl.style.transform = "translateX(0)";
    veil.style.transition = "opacity .22s ease"; veil.style.opacity = "0";
    g.cl.classList.remove("active"); g.cr.classList.remove("active");
    setTimeout(() => { appEl.style.transition = ""; appEl.style.transform = ""; }, 240);
  }

  root.addEventListener("pointerdown", e => {
    if (state.anim) return;
    gs = { x0:e.clientX, y0:e.clientY, mode:"scrub", samples:[{x:e.clientX,t:performance.now()}] };
    try { root.setPointerCapture(e.pointerId); } catch(_){}
    showScrub(e.clientX);
  });
  root.addEventListener("pointermove", e => {
    if (!gs) return;
    const dx = e.clientX - gs.x0, dy = e.clientY - gs.y0;
    gs.samples.push({ x:e.clientX, t:performance.now() });
    if (gs.samples.length > 6) gs.samples.shift();
    if (gs.mode === "scrub"){
      showScrub(e.clientX);
      if (Math.abs(dx) >= SWIPE_ENGAGE && Math.abs(dx) > Math.abs(dy) * 1.2){ gs.mode = "swipe"; hideScrub(); }
    }
    if (gs.mode === "swipe"){ preview(dx); e.preventDefault(); }
  });
  function endGesture(e){
    if (!gs) return;
    const dx = e.clientX - gs.x0;
    const s = gs.samples, first = s[0], last = s[s.length-1];
    const dt = Math.max(1, last.t - first.t);
    const vx = (last.x - first.x) / dt;                 // px/ms over the recent window
    const mode = gs.mode; gs = null;
    try { root.releasePointerCapture(e.pointerId); } catch(_){}

    const dir = dx < 0 ? 1 : -1;
    const target = state.idx + dir;
    const canGo = target >= 0 && target < days.length;
    const committed = canGo && (Math.abs(dx) > SWIPE_COMMIT || (Math.abs(vx) > FLICK && Math.abs(dx) > 44 && (vx < 0) === (dir === 1)));

    if (mode === "swipe" || committed){
      hideScrub();
      if (committed){ appEl.style.transition = ""; goTo(target); }
      else springBack();
    } else {
      hideScrub();                                       // it was a scrub
    }
  }
  root.addEventListener("pointerup", endGesture);
  root.addEventListener("pointercancel", () => { if (gs){ gs = null; hideScrub(); springBack(); } });
}

/* --- day transition: crossfade + slide + day/night veil ---------------------- */
function goTo(target){
  target = clamp(target, 0, days.length - 1);
  if (target === state.idx || state.anim) return;
  const outSign = target > state.idx ? -1 : 1;          // later day: current slides left

  if (reduceMotion){ renderPage(target); return; }

  state.anim = true;
  appEl.style.transition = "transform .17s ease, opacity .17s ease";
  appEl.style.transform = `translateX(${outSign * 26}px)`;
  appEl.style.opacity = "0";
  veil.style.transition = "opacity .17s ease"; veil.style.opacity = "0.28";

  setTimeout(() => {
    renderPage(target);
    appEl.style.transition = "none";
    appEl.style.transform = `translateX(${-outSign * 26}px)`;
    appEl.style.opacity = "0";
    void appEl.offsetWidth;                              // reflow
    appEl.style.transition = "transform .23s ease, opacity .23s ease";
    appEl.style.transform = "translateX(0)";
    appEl.style.opacity = "1";
    veil.style.opacity = "0";
    setTimeout(() => { appEl.style.transition = ""; appEl.style.transform = ""; state.anim = false; }, 250);
  }, 175);
}

/* --------------------------------- theming ----------------------------------- */

  const MOON = '<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>';
  function apply(mode){ document.documentElement.setAttribute("data-theme", mode); icon.innerHTML = mode === "dark" ? MOON : SUN; label.textContent = mode === "dark" ? "Dark" : "Light"; }
  let mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  apply(mode);
  btn.addEventListener("click", () => { mode = mode === "dark" ? "light" : "dark"; apply(mode); });
})();

/* --------------------------------- boot -------------------------------------- */
renderPage(todayIndex);
</script>
