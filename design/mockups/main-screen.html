/* ============================================================================

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

}

.theme-toggle {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 50;
  font: 600 12px var(--font-ui);
  letter-spacing: 0.02em;
  color: var(--page-fg);
  background: color-mix(in srgb, var(--page-bg) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--page-fg) 35%, transparent);
  border-radius: 999px;
  padding: 7px 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.theme-toggle:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
.theme-toggle svg { width: 14px; height: 14px; }

.caption {
  font: 400 12.5px var(--font-ui);
  color: var(--page-fg);
  letter-spacing: 0.01em;
  text-align: center;
}

/* ============================================================================
   DEVICE CHROME
   ========================================================================== */
.device {
  width: calc(var(--screen-w) + 24px);
  height: calc(var(--screen-h) + 24px);
  background: var(--bezel);
  border: 1px solid var(--bezel-edge);
  border-radius: var(--radius-device);
  padding: 12px;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.3);
}
.screen {
  position: relative;
  width: var(--screen-w);
  height: var(--screen-h);
  border-radius: var(--radius-screen);
  overflow: hidden;
  background: var(--sky);          /* Color.sky, edge-to-edge (ignoresSafeArea) */
}

/* Dynamic Island + status bar sit above the app content, pinned. */
.island {
  position: absolute;
  top: 11px; left: 50%;
  transform: translateX(-50%);
  width: 125px; height: 37px;
  background: #000;
  border-radius: 20px;
  z-index: 20;
}
.statusbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px 0 34px;
  color: var(--sea);
  pointer-events: none;
}
.statusbar .clock {
  font: 600 15px var(--font-ui);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  padding-top: 2px;
}
.statusbar .indicators { display: flex; align-items: center; gap: 6px; }
.statusbar .indicators svg { display: block; fill: currentColor; }

/* Scroll viewport = the DayPage ScrollView. */
.viewport {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.viewport::-webkit-scrollbar { width: 0; height: 0; }

/* ============================================================================

.app {

.nowline {

.curve svg { display: block; width: 100%; height: auto; }

/* --- Table block: spacing 12 --- */
.tableblock { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; width: 100%; }

.extremes {
  display: grid;

  align-items: baseline;
  column-gap: 16px;
  width: 100%;

.extremes .tag {
  font: 600 var(--fs-engraving) var(--font-ui);

  padding: 8px 0;
}
.extremes .cell {

  padding: 8px 0;
}
.extremes .num  { text-align: right; }
.extremes .rule {
  grid-column: 1 / -1;

  background: var(--hairline);
}

.sunrow {

  align-items: center;

  font: 400 var(--fs-meta) var(--font-ui);

  font-variant-numeric: tabular-nums;

}

  return `${Math.floor(mins/60)} h ${String(mins%60).padStart(2,"0")}`;
}
function el(tag, cls, txt){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* --------------------------------- gear teeth -------------------------------- */
(function gear(){
  const g = document.getElementById("gearteeth");
  for (let k = 0; k < 8; k++){
    g.appendChild(svg("rect", {
      x: 10.6, y: 1.4, width: 2.8, height: 4.2, rx: 0.9,
      transform: `rotate(${k*45} 12 12)`
    }));
  }
})();

/* --------------------------------- date label -------------------------------- */
(function date(){
  const iso = (DATA.meta.source.match(/computed for (\d{4}-\d{2}-\d{2})/) || [])[1] || "2026-07-24";
  const d = new Date(iso + "T12:00:00Z");
  const label = new Intl.DateTimeFormat("en-GB",
    { weekday:"long", day:"numeric", month:"long", timeZone:"UTC" }).format(d); // "Friday 24 July"
  document.getElementById("date").textContent = label;
  document.getElementById("clock").textContent = DATA.nowTime;
})();

/* ---------------------------- derived "now" state ---------------------------- */
const nowMin = minsOf(DATA.nowTime);
const evMin  = DATA.events.map(e => minsOf(e.time));
const nextIdx = evMin.findIndex(t => t >= nowMin);        // first not-yet-past extreme
const nextEx  = DATA.events[nextIdx];
const rising  = nextEx.type === "high";                   // slope sign at now (low → next high)

/* ---------------------------------- hero ------------------------------------- */
(function hero(){
  const host = document.getElementById("hero");
  host.appendChild(el("div", "eyebrow", nextEx.type === "high" ? "Next high water" : "Next low water"));
  host.appendChild(el("div", "hero-time", nextEx.time));
  host.appendChild(el("div", "hero-sub", `${hStr(nextEx.height)} · ${countdown(minsOf(nextEx.time), nowMin)}`));

  const nl = el("div", "nowline");
  nl.appendChild(el("span", null, `now ${hStr(DATA.nowHeight)}`));
  const tri = el("span", "tri");
  tri.innerHTML = rising
    ? '<svg viewBox="0 0 12 12"><path d="M6 2 L10.5 9.5 L1.5 9.5 Z"/></svg>'
    : '<svg viewBox="0 0 12 12"><path d="M6 10 L1.5 2.5 L10.5 2.5 Z"/></svg>';
  nl.appendChild(tri);
  nl.appendChild(el("span", null, rising ? "rising" : "falling"));
  host.appendChild(nl);
})();

/* ------------------------------ extremes table ------------------------------- */
(function extremes(){
  const host = document.getElementById("extremes");
  DATA.events.forEach((ev, i) => {
    if (i > 0) host.appendChild(el("div", "rule"));
    const t = evMin[i];
    // Row emphasis (ExtremesTable.rowColor): past → tertiary, next → sea, later → secondary.
    const rowColor = t < nowMin ? "var(--sea-tertiary)"
                   : (i === nextIdx ? "var(--sea)" : "var(--sea-secondary)");
    const swingColor = t < nowMin ? "var(--sea-tertiary)" : "var(--sea-secondary)";

    const tag = el("div", "tag", ev.type === "high" ? "HW" : "LW");
    tag.style.color = rowColor;
    const time = el("div", "cell", ev.time);
    time.style.color = rowColor;
    const height = el("div", "cell num", hVal(ev.height));   // heightValue — no unit in the table
    height.style.color = rowColor;

    const swing = el("div", "cell num");
    if (i > 0){
      const d = ev.height - DATA.events[i-1].height;         // signed Δ vs previous extreme
      swing.textContent = `${d >= 0 ? "↑" : "↓"} ${hVal(Math.abs(d))}`;
      swing.style.color = swingColor;
    }
    host.append(tag, time, height, swing);
  });
})();

/* ---------------------------------- sun row ---------------------------------- */
(function sun(){
  const host = document.getElementById("sunrow");
  host.appendChild(el("span", "sun-label", "SUN"));
  host.appendChild(el("span", "tick"));
  host.appendChild(el("span", null, DATA.sunrise));
  host.appendChild(el("span", "arrow", "→"));
  host.appendChild(el("span", "tick"));
  host.appendChild(el("span", null, DATA.sunset));
  const len = minsOf(DATA.sunset) - minsOf(DATA.sunrise);
  host.appendChild(el("span", null, `· ${dayLength(len)}`));
})();

/* =============================================================================
   TIDE CURVE  (TideCurveView + CurveLayout, CurveStyle.app)
   ============================================================================= */
(function curve(){
  const root = document.getElementById("curveSvg");
  const W = 393, H = 200, TOP = 24, BOT = H - 24, PLOTH = BOT - TOP;   // insets 24/24
  const N = DATA.curve.length;

  // x(t): linear in UTC across the day; samples indexed (last = next midnight).
  const xSample = i => (i * 10 / 1440) * W;                 // 10-min spacing
  const xTime   = mins => (mins / 1440) * W;

  // y-domain: samples ∪ exact extreme heights, padded max(range,1) × 0.07.
  const hs = DATA.curve.map(p => p.h).concat(DATA.events.map(e => e.height));
  let lo = Math.min(...hs), hi = Math.max(...hs);
  const pad = Math.max(hi - lo, 1) * 0.07; lo -= pad; hi += pad;
  const span = hi - lo;
  const yOf = h => TOP + (1 - (h - lo) / span) * PLOTH;

  const defs = svg("defs");
  const grad = svg("linearGradient", { id:"seaFill", gradientUnits:"userSpaceOnUse", x1:0, y1:TOP, x2:0, y2:BOT });
  grad.appendChild(svg("stop", { offset:"0", class:"c-fill-top" }));
  grad.appendChild(svg("stop", { offset:"1", class:"c-fill-bottom" }));
  defs.appendChild(grad);
  root.appendChild(defs);

  // 1 — Sea fill (curve → plot-bottom, vertical gradient seaFillTop → transparent).
  let d = `M ${xSample(0).toFixed(2)} ${yOf(DATA.curve[0].h).toFixed(2)}`;
  for (let i = 1; i < N; i++) d += ` L ${xSample(i).toFixed(2)} ${yOf(DATA.curve[i].h).toFixed(2)}`;
  const fillD = d + ` L ${W} ${BOT} L 0 ${BOT} Z`;
  root.appendChild(svg("path", { d: fillD, fill:"url(#seaFill)" }));

  // 2 — Horizon line (0.5pt hairline) at y(horizonDatum); datum ≈ (dayMax + dayMin)/2.
  const datum = (DATA.range.min + DATA.range.max) / 2;      // 6.1
  const hy = yOf(datum);
  root.appendChild(svg("line", { class:"c-horizon", x1:0, y1:hy, x2:W, y2:hy, "stroke-width":0.5 }));
  const knock = svg("rect", { class:"c-knockout" });        // sized after we measure the label
  root.appendChild(knock);
  const hLabel = svg("text", { class:"svg-horizon", "text-anchor":"end", x: W - 4, y: hy });
  hLabel.setAttribute("dominant-baseline", "middle");
  hLabel.textContent = hVal(datum);                          // heightValue — no unit ("6.1")
  root.appendChild(hLabel);

  // 4 — Sun ticks (1pt dawn, 7pt rising from plot bottom).
  const sunTimes = [];
  [DATA.sunrise, DATA.sunset].forEach(s => {
    const x = Math.min(Math.max(xTime(minsOf(s)), 0), W);
    root.appendChild(svg("line", { class:"c-tick", x1:x, y1:BOT-7, x2:x, y2:BOT, "stroke-width":1 }));
    const t = svg("text", { class:"svg-sun", "text-anchor":"middle", x:x, y: BOT + 13, "data-tick":x });
    t.textContent = s;
    root.appendChild(t);
    sunTimes.push({ node:t, tickX:x });
  });

  // 5 — In-plot extreme labels: time (chartTime, sea) over height (chartHeight, secondary).
  const lwSpans = [];
  DATA.events.forEach(ev => {
    const mx = xTime(minsOf(ev.time));
    const my = yOf(ev.height);
    const r  = ev.type === "high" ? 3 : 3.5;
    const blockH = 24;
    let blockTop = ev.type === "high" ? my - r - 3 - blockH : my + r + 3;
    blockTop = Math.min(Math.max(blockTop, 0), H - blockH);

    const tNode = svg("text", { class:"svg-ctime",   "text-anchor":"middle", x:mx, y: blockTop + 9,  "data-mx":mx });
    tNode.textContent = ev.time;
    const hNode = svg("text", { class:"svg-cheight", "text-anchor":"middle", x:mx, y: blockTop + 21, "data-mx":mx });
    hNode.textContent = hStr(ev.height);                     // in-plot height DOES carry the unit
    root.appendChild(tNode); root.appendChild(hNode);
    if (ev.type === "low") lwSpans.push({ node:tNode, alt:hNode, mx });
  });

  // 6 — Now-line (0.75pt seaTertiary, full band), today only.
  const nowX = Math.min(Math.max(xTime(nowMin), 1), W - 1);
  root.appendChild(svg("line", { class:"c-nowline", x1:nowX, y1:TOP, x2:nowX, y2:BOT, "stroke-width":0.75 }));

  // Overlay group (curve stroke + markers) with a punch-out at the now-dot.
  const mask = svg("mask", { id:"nowPunch" });
  mask.appendChild(svg("rect", { x:0, y:0, width:W, height:H, fill:"#fff" }));
  const nowY = yOf(DATA.nowHeight);
  mask.appendChild(svg("circle", { cx:nowX, cy:nowY, r:5.5, fill:"#000" }));   // dotR + 2 halo
  defs.appendChild(mask);
  const overlay = svg("g", { mask:"url(#nowPunch)" });

  // 3 — Curve stroke (open polyline, 1.5pt sea, round cap/join).
  overlay.appendChild(svg("path", { class:"c-stroke", d:d, "stroke-width":1.5, "stroke-linecap":"round", "stroke-linejoin":"round" }));

  // 5 — Markers: HW filled dot r3, LW open ring r3.5 stroke 1.5.
  DATA.events.forEach(ev => {
    const cx = xTime(minsOf(ev.time)), cy = yOf(ev.height);
    if (ev.type === "high") overlay.appendChild(svg("circle", { class:"c-hw", cx, cy, r:3 }));
    else overlay.appendChild(svg("circle", { class:"c-lw", cx, cy, r:3.5, "stroke-width":1.5 }));
  });
  root.appendChild(overlay);

  // 7 — Now-dot (r3.5 sea) on top of the punched gap.
  root.appendChild(svg("circle", { class:"c-nowdot", cx:nowX, cy:nowY, r:3.5 }));

  /* ---- second pass: measure text, clamp label x, resolve sun-time collisions ---- */
  const clampX = (desired, w) => Math.min(Math.max(desired, 0), Math.max(W - w, 0));

  requestAnimationFrame(() => {
    // Extreme label lines: centre on marker, clamp leading edge to [0, W - w].
    root.querySelectorAll("[data-mx]").forEach(node => {
      const mx = parseFloat(node.getAttribute("data-mx"));
      const w  = node.getComputedTextLength();
      node.setAttribute("x", clampX(mx - w/2, w) + w/2);    // recentre after clamp
    });
    // LW label spans (bottom strip) — max(time,height) width, for sun-time avoidance.
    const spans = lwSpans.map(s => {
      const w = Math.max(s.node.getComputedTextLength(), s.alt.getComputedTextLength());
      const x = clampX(s.mx - w/2, w);
      return { lo:x, hi:x + w, mx:s.mx };
    });
    // Sun times: centre + clamp, then slide clear of any overlapping LW span.
    sunTimes.forEach(s => {
      const w = s.node.getComputedTextLength();
      let cx = clampX(s.tickX - w/2, w) + w/2;
      spans.forEach(ex => {
        if (cx - w/2 < ex.hi && cx + w/2 > ex.lo){
          cx = s.tickX >= ex.mx ? ex.hi + 3 + w/2 : ex.lo - 3 - w/2;
          cx = clampX(cx - w/2, w) + w/2;
        }
      });
      s.node.setAttribute("x", cx);
    });
    // Horizon knock-out rect (sky) behind the datum label, inset −2.
    const b = hLabel.getBBox();
    knock.setAttribute("x", b.x - 2);
    knock.setAttribute("y", b.y - 2);
    knock.setAttribute("width", b.width + 4);
    knock.setAttribute("height", b.height + 4);
  });
})();

/* --------------------------------- theming ----------------------------------- */
(function theme(){
  const btn = document.getElementById("themeToggle");
  const icon = document.getElementById("themeIcon");
  const label = document.getElementById("themeLabel");
  const SUN  = '<circle cx="12" cy="12" r="4.5"/><g stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.6" y2="4.4"/></g>';
  const MOON = '<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>';

  function apply(mode){
    document.documentElement.setAttribute("data-theme", mode);
    icon.innerHTML = mode === "dark" ? MOON : SUN;
    label.textContent = mode === "dark" ? "Dark" : "Light";
  }
  // Initial state follows the OS preference (prefers-color-scheme); the toggle overrides it.
  let mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  apply(mode);
  btn.addEventListener("click", () => { mode = mode === "dark" ? "light" : "dark"; apply(mode); });
})();
</script>
